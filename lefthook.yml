# Git hooks (wired via the prepare script; `npx lefthook install` to redo it).
pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,js}'
      run: npx biome check --no-errors-on-unmatched {staged_files}

pre-push:
  commands:
    check:
      run: npm run check
    test:
      run: npm test
